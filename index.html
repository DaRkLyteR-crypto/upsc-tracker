<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sankalp — UPSC Prep Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F6FA;
      --bg2: #ECEEF5;
      --card: #FFFFFF;
      --card-hover: #F0F2F8;
      --border: rgba(0,0,0,0.08);
      --text: #1A1D2E;
      --muted: #8A90A2;
      --accent: #E85D2F;
      --accent2: #F5A623;
      --success: #2BA86D;
      --c-math: #0097A7;
      --c-geo: #1976D2;
      --c-polity: #E64A19;
      --c-env: #388E3C;
      --c-sci: #7B1FA2;
      --c-eco: #F57C00;
      --c-hist: #C62828;
      --c-igeo: #0097A7;
      --c-ca: #C2185B;
      --c-daily: #546E7A;
      --c-pts: #512DA8;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html{scroll-behavior:smooth;}
    body{
      font-family:'DM Sans',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100dvh;
      overflow-x:hidden;
    }
    body::before{
      content:'';
      position:fixed;inset:0;
      background:
        radial-gradient(ellipse 60% 40% at 15% 10%, rgba(232,93,47,.06) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 85% 85%, rgba(25,118,210,.05) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 50% 50%, rgba(245,166,35,.04) 0%, transparent 70%);
      pointer-events:none;z-index:0;
    }

    /* ── QUOTE BANNER ── */
    .quote-banner{
      position:relative;z-index:5;
      margin:12px 14px;
      padding:16px 18px;
      background:linear-gradient(135deg,rgba(232,93,47,.08),rgba(245,166,35,.07));
      border:1px solid rgba(232,93,47,.2);
      border-radius:18px;
      animation:slideDown .5s cubic-bezier(.16,1,.3,1);
    }
    @keyframes slideDown{from{opacity:0;transform:translateY(-16px);}to{opacity:1;transform:translateY(0);}}
    .quote-icon{font-size:18px;display:block;margin-bottom:6px;color:var(--accent2);}
    .quote-text{
      font-family:'Playfair Display',serif;
      font-style:italic;
      font-size:14.5px;line-height:1.65;
      color:#B34A1A;margin-bottom:6px;
    }
    .quote-author{font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.4px;}

    /* ── HEADER ── */
    .app-header{
      position:sticky;top:0;z-index:100;
      background:rgba(245,246,250,.94);
      backdrop-filter:blur(20px);
      border-bottom:1px solid var(--border);
      padding:10px 16px;
      display:flex;justify-content:space-between;align-items:center;
    }
    .app-title{
      font-family:'Playfair Display',serif;
      font-size:22px;font-weight:700;
      background:linear-gradient(135deg,#FF6B35,#FFB830);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    }
    .app-subtitle{font-size:10.5px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin-top:1px;}
    .header-right{text-align:right;}
    .overall-pct{font-size:22px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1;}
    .overall-lbl{font-size:10.5px;color:var(--muted);}

    /* ── BOTTOM NAV ── */
    .bottom-nav{
      position:fixed;bottom:0;left:0;right:0;z-index:100;
      background:rgba(245,246,250,.97);
      backdrop-filter:blur(20px);
      border-top:1px solid var(--border);
      display:flex;
      padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    }
    .nav-btn{
      flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
      padding:6px 4px;background:none;border:none;
      color:var(--muted);font-family:'DM Sans',sans-serif;font-size:10.5px;
      cursor:pointer;transition:all .2s;border-radius:12px;
    }
    .nav-btn.active{color:var(--accent);}
    .nav-icon{font-size:20px;transition:transform .2s;}
    .nav-btn.active .nav-icon{transform:scale(1.12);}
    .nav-badge{
      display:none;position:absolute;top:2px;right:14px;
      min-width:16px;height:16px;padding:0 4px;
      background:var(--accent);color:#fff;
      font-size:9px;font-weight:700;border-radius:10px;
      display:flex;align-items:center;justify-content:center;
    }
    .nav-btn{position:relative;}

    /* ── MAIN CONTENT ── */
    .main-content{padding-bottom:calc(72px + env(safe-area-inset-bottom));position:relative;z-index:1;}
    .tab-content{display:none;}
    .tab-content.active{display:block;animation:tabIn .3s ease;}
    @keyframes tabIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

    /* ── DATE NAVIGATION ── */
    .date-nav{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 16px 10px;gap:10px;
    }
    .date-nav-btn{
      width:42px;height:42px;border-radius:12px;
      border:1px solid var(--border);background:var(--card);
      color:var(--text);font-size:22px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:all .18s;flex-shrink:0;
    }
    .date-nav-btn:hover{border-color:var(--accent);color:var(--accent);}
    .date-nav-btn:disabled{opacity:.3;cursor:not-allowed;}
    .date-center{flex:1;text-align:center;}
    .date-main{font-family:'Playfair Display',serif;font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
    .today-pill{
      font-family:'DM Sans',sans-serif;
      font-size:10px;font-weight:600;font-style:normal;
      padding:2px 8px;border-radius:20px;
      background:rgba(255,107,53,.2);border:1px solid rgba(255,107,53,.4);
      color:var(--accent);letter-spacing:.3px;
    }
    .date-day{font-size:12px;color:var(--muted);margin-top:2px;}

    /* ── DAY PROGRESS ── */
    .day-progress-wrap{margin:0 14px 10px;}
    .day-progress{
      padding:14px 16px;
      background:var(--card);border:1px solid var(--border);
      border-radius:16px;
      box-shadow:0 1px 4px rgba(0,0,0,.05);
    }
    .progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
    .progress-label{font-size:12.5px;color:var(--muted);font-weight:500;}
    .progress-count{font-size:13px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
    .progress-track{height:5px;background:rgba(0,0,0,.08);border-radius:100px;overflow:hidden;}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:100px;transition:width .6s cubic-bezier(.16,1,.3,1);min-width:0;}
    .progress-fill.full{background:linear-gradient(90deg,var(--success),#5AF58A);}

    /* ── CATEGORY GROUP ── */
    .cat-section{margin:0 14px 6px;}
    .cat-header{display:flex;align-items:center;gap:7px;margin-bottom:6px;padding:0 2px;}
    .cat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
    .cat-name{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);}

    /* ── TASK CARD ── */
    .task-card{
      display:flex;align-items:flex-start;gap:12px;
      padding:13px 14px;
      background:var(--card);border:1px solid var(--border);
      border-radius:12px;margin-bottom:7px;
      cursor:pointer;transition:background .15s,transform .12s;
      position:relative;overflow:hidden;
      -webkit-user-select:none;user-select:none;
      box-shadow:0 1px 4px rgba(0,0,0,.05);
    }
    .task-card::before{
      content:'';position:absolute;left:0;top:0;bottom:0;
      width:3px;border-radius:3px 0 0 3px;
    }
    .task-card:active{transform:scale(.98);background:var(--card-hover);}
    .task-card.done{opacity:.55;}
    .task-cb{
      width:22px;height:22px;border-radius:7px;
      border:2px solid rgba(0,0,0,.18);
      flex-shrink:0;margin-top:1px;
      display:flex;align-items:center;justify-content:center;
      transition:all .22s cubic-bezier(.34,1.56,.64,1);
    }
    .task-card.done .task-cb{background:var(--success);border-color:var(--success);}
    .checkmark{display:none;color:#fff;font-size:12px;font-weight:700;line-height:1;}
    .task-card.done .checkmark{display:block;}
    .task-txt{flex:1;font-size:13.5px;line-height:1.45;color:var(--text);transition:all .2s;}
    .task-card.done .task-txt{text-decoration:line-through;color:var(--muted);}

    /* category left-border colours */
    .bg-math::before{background:var(--c-math);}
    .bg-geo::before{background:var(--c-geo);}
    .bg-polity::before{background:var(--c-polity);}
    .bg-env::before{background:var(--c-env);}
    .bg-sci::before{background:var(--c-sci);}
    .bg-eco::before{background:var(--c-eco);}
    .bg-hist::before{background:var(--c-hist);}
    .bg-igeo::before{background:var(--c-igeo);}
    .bg-ca::before{background:var(--c-ca);}
    .bg-daily::before{background:var(--c-daily);}
    .bg-pts::before{background:var(--c-pts);}

    @keyframes checkPop{0%{transform:scale(.5);}60%{transform:scale(1.25);}100%{transform:scale(1);}}
    .task-card.just-done .task-cb{animation:checkPop .35s cubic-bezier(.34,1.56,.64,1);}

    /* ── REST DAY ── */
    .rest-day{text-align:center;padding:50px 24px;}
    .rest-icon{font-size:52px;margin-bottom:14px;}
    .rest-title{font-family:'Playfair Display',serif;font-size:22px;margin-bottom:8px;}
    .rest-text{font-size:13.5px;color:var(--muted);line-height:1.7;}

    /* ── CALENDAR VIEW ── */
    .cal-section-hdr{padding:14px 16px 6px;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.8px;}
    .cal-item{
      margin:0 14px 10px;border-radius:16px;
      border:1px solid var(--border);background:var(--card);overflow:hidden;
      box-shadow:0 1px 4px rgba(0,0,0,.05);
    }
    .cal-hdr{
      display:flex;justify-content:space-between;align-items:center;
      padding:13px 15px;cursor:pointer;transition:background .15s;
    }
    .cal-hdr:active{background:var(--card-hover);}
    .cal-date-info h3{font-family:'Playfair Display',serif;font-size:16px;display:flex;align-items:center;gap:7px;}
    .cal-date-info p{font-size:11px;color:var(--muted);margin-top:2px;}
    .cal-right{display:flex;align-items:center;gap:8px;}
    .cal-pill{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;}
    .cal-pill.done-pill{background:rgba(61,186,126,.15);color:var(--success);}
    .cal-pill.all-pill{background:rgba(61,186,126,.25);color:var(--success);}
    .cal-pill.zero-pill{background:rgba(255,255,255,.06);color:var(--muted);}
    .expand-arr{font-size:12px;color:var(--muted);transition:transform .25s;}
    .cal-item.open .expand-arr{transform:rotate(180deg);}
    .mini-prog{height:2px;background:rgba(0,0,0,.07);}
    .mini-prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s;}
    .cal-tasks{display:none;padding:4px 12px 12px;}
    .cal-item.open .cal-tasks{display:block;}

    /* ── PENDING VIEW ── */
    .pending-top{padding:16px 16px 8px;text-align:center;}
    .pending-title{font-family:'Playfair Display',serif;font-size:22px;margin-bottom:4px;}
    .pending-sub{font-size:13px;color:var(--muted);}
    .pending-badge{
      display:inline-block;margin-top:10px;
      padding:4px 16px;border-radius:20px;
      background:rgba(232,93,47,.1);border:1px solid rgba(232,93,47,.25);
      color:var(--accent);font-size:13.5px;font-weight:700;
    }
    .pending-group{margin:0 14px 14px;}
    .pending-date-hdr{
      font-size:11.5px;font-weight:600;text-transform:uppercase;
      letter-spacing:.7px;color:var(--muted);
      padding:6px 4px 8px;border-bottom:1px solid var(--border);margin-bottom:8px;
    }
    .pending-date-hdr span{color:var(--accent);}

    /* ── EMPTY STATE ── */
    .empty-state{text-align:center;padding:60px 24px;}
    .empty-icon{font-size:56px;margin-bottom:14px;}
    .empty-title{font-family:'Playfair Display',serif;font-size:22px;margin-bottom:8px;}
    .empty-text{font-size:13.5px;color:var(--muted);line-height:1.7;}

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:4px;}

    /* ── FILTER CHIPS (Today tab) ── */
    .filter-row{
      display:flex;gap:7px;overflow-x:auto;padding:0 14px 10px;
      scrollbar-width:none;
    }
    .filter-row::-webkit-scrollbar{display:none;}
    .chip{
      flex-shrink:0;padding:5px 13px;border-radius:20px;
      border:1px solid var(--border);background:var(--card);
      color:var(--muted);font-size:11.5px;font-weight:500;cursor:pointer;
      transition:all .18s;white-space:nowrap;
      box-shadow:0 1px 3px rgba(0,0,0,.05);
    }
    .chip.active{background:rgba(232,93,47,.1);border-color:rgba(232,93,47,.35);color:var(--accent);}
  </style>
</head>
<body>

<!-- QUOTE BANNER -->
<div class="quote-banner" id="quoteBanner">
  <span class="quote-icon">✦</span>
  <div class="quote-text" id="quoteText">Loading your daily inspiration...</div>
  <div class="quote-author" id="quoteAuthor"></div>
</div>

<!-- HEADER -->
<header class="app-header">
  <div>
    <div class="app-title">Sankalp</div>
    <div class="app-subtitle">UPSC Prep Tracker</div>
  </div>
  <div class="header-right">
    <div class="overall-pct" id="overallPct">0%</div>
    <div class="overall-lbl">overall</div>
  </div>
</header>

<!-- MAIN -->
<main class="main-content">

  <!-- TAB: TODAY -->
  <div id="tab-today" class="tab-content active">
    <div class="date-nav">
      <button class="date-nav-btn" id="prevBtn" onclick="navDate(-1)">&#8249;</button>
      <div class="date-center">
        <div class="date-main" id="dateDisplay">—</div>
        <div class="date-day" id="dayDisplay">—</div>
      </div>
      <button class="date-nav-btn" id="nextBtn" onclick="navDate(1)">&#8250;</button>
    </div>

    <div class="day-progress-wrap">
      <div class="day-progress" id="dayProgressBox">
        <div class="progress-row">
          <span class="progress-label">Day Progress</span>
          <span class="progress-count" id="progressCount">0 / 0</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
      </div>
    </div>

    <div class="filter-row" id="filterRow"></div>
    <div id="taskContainer"></div>
  </div>

  <!-- TAB: ALL DAYS -->
  <div id="tab-calendar" class="tab-content">
    <div style="padding:14px 16px 4px;">
      <h2 style="font-family:'Playfair Display',serif;font-size:22px;">All Dates</h2>
      <p style="font-size:12.5px;color:var(--muted);margin-top:3px;">Tap a date to expand · tap tasks to complete</p>
    </div>
    <div id="calendarContainer"></div>
  </div>

  <!-- TAB: PENDING -->
  <div id="tab-pending" class="tab-content">
    <div class="pending-top">
      <h2 class="pending-title">Pending Tasks</h2>
      <p class="pending-sub">All incomplete tasks across the schedule</p>
      <div class="pending-badge" id="pendingBadge">— tasks pending</div>
    </div>
    <div id="pendingContainer"></div>
  </div>

</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-btn active" data-tab="today" onclick="switchTab('today')">
    <span class="nav-icon">📅</span>
    <span>Today</span>
  </button>
  <button class="nav-btn" data-tab="calendar" onclick="switchTab('calendar')">
    <span class="nav-icon">🗓️</span>
    <span>All Days</span>
  </button>
  <button class="nav-btn" data-tab="pending" onclick="switchTab('pending')">
    <span class="nav-icon">⏳</span>
    <span>Pending</span>
    <span class="nav-badge" id="pendingNavBadge"></span>
  </button>
</nav>

<script>
// ================================================================
// MOTIVATIONAL QUOTES (60 UPSC-themed, non-repeating across loads)
// ================================================================
const QUOTES = [
  {t:"The secret of getting ahead is getting started.",a:"Mark Twain"},
  {t:"Success is the sum of small efforts, repeated day in and day out.",a:"Robert Collier"},
  {t:"Discipline is the bridge between goals and accomplishment.",a:"Jim Rohn"},
  {t:"The UPSC exam is not just a test of knowledge — it is a test of character.",a:"Unknown"},
  {t:"Don't watch the clock; do what it does. Keep going.",a:"Sam Levenson"},
  {t:"Push yourself, because no one else is going to do it for you.",a:"Unknown"},
  {t:"Great things never come from comfort zones.",a:"Unknown"},
  {t:"The future belongs to those who believe in the beauty of their dreams.",a:"Eleanor Roosevelt"},
  {t:"It's not about having time. It's about making time.",a:"Unknown"},
  {t:"The difference between ordinary and extraordinary is that little extra.",a:"Jimmy Johnson"},
  {t:"Success doesn't come from what you do occasionally. It comes from what you do consistently.",a:"Marie Forleo"},
  {t:"Every expert was once a beginner. Every pro was once an amateur.",a:"Unknown"},
  {t:"Motivation gets you going but discipline keeps you growing.",a:"John C. Maxwell"},
  {t:"You don't have to be great to start, but you have to start to be great.",a:"Zig Ziglar"},
  {t:"Believe you can and you're halfway there.",a:"Theodore Roosevelt"},
  {t:"It always seems impossible until it's done.",a:"Nelson Mandela"},
  {t:"Don't stop when you're tired. Stop when you're done.",a:"Unknown"},
  {t:"Hard work beats talent when talent doesn't work hard.",a:"Tim Notke"},
  {t:"In the middle of difficulty lies opportunity.",a:"Albert Einstein"},
  {t:"Strive for progress, not perfection.",a:"Unknown"},
  {t:"A journey of a thousand miles begins with a single step.",a:"Lao Tzu"},
  {t:"The mind is everything. What you think, you become.",a:"Buddha"},
  {t:"Quality is not an act; it is a habit.",a:"Aristotle"},
  {t:"Study not to know more, but to be more.",a:"Unknown"},
  {t:"The IAS officer you want to become starts with the student you are today.",a:"Unknown"},
  {t:"Your sacrifice today is your strength tomorrow.",a:"Unknown"},
  {t:"Every page you study today is a step closer to your dream.",a:"Unknown"},
  {t:"Stay patient and trust your journey.",a:"Unknown"},
  {t:"Knowledge is power, but applied knowledge is superpower.",a:"Unknown"},
  {t:"When you feel like quitting, think about why you started.",a:"Unknown"},
  {t:"The price of excellence is discipline. The cost of mediocrity is disappointment.",a:"William Arthur Ward"},
  {t:"Prepare yourself in silence, then let your results make the noise.",a:"Unknown"},
  {t:"Focus on your goal, not your fear.",a:"Unknown"},
  {t:"The best investment you can make is in yourself.",a:"Warren Buffett"},
  {t:"Small daily improvements over time lead to stunning results.",a:"Robin Sharma"},
  {t:"Aspirants are made in silence, not in applause.",a:"Unknown"},
  {t:"The syllabus doesn't defeat you — giving up does.",a:"Unknown"},
  {t:"This is not just an exam. This is your calling.",a:"Unknown"},
  {t:"UPSC is a marathon. Train your mind like a marathon runner.",a:"Unknown"},
  {t:"Your dedication today will inspire others tomorrow.",a:"Unknown"},
  {t:"The nation needs officers who think critically and act decisively.",a:"Unknown"},

  {t:"Work hard in silence; let your results be your noise.",a:"Frank Ocean"},
  {t:"Revise what you learnt; review what you did; refocus on what matters.",a:"Unknown"},
  {t:"Rise above the storm and you will find the sunshine.",a:"Mario Fernandez"},

  {t:"Make today's effort impossible to ignore.",a:"Unknown"},

  {t:"Reading one more chapter today means one less regret tomorrow.",a:"Unknown"},
  {t:"Courage is not the absence of fear; it is doing the work in spite of it.",a:"Unknown"},

  {t:"The roots of education are bitter, but the fruit is sweet.",a:"Aristotle"},
  {t:"You are only one decision away from a totally different result.",a:"Unknown"},
  {t:"Dream with your eyes open and work with your eyes sharper.",a:"Unknown"},
  {t:"Let your dedication be so fierce that doubt forgets your address.",a:"Unknown"},
];

function getNextQuote(){
  let order=JSON.parse(localStorage.getItem('q_order')||'null');
  let idx=parseInt(localStorage.getItem('q_idx')||'0');
  if(!order||idx>=order.length){
    order=[...Array(QUOTES.length).keys()];
    for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
    idx=0;
    localStorage.setItem('q_order',JSON.stringify(order));
  }
  const q=QUOTES[order[idx]];
  localStorage.setItem('q_idx',idx+1);
  return q;
}

// ================================================================
// CATEGORIES
// ================================================================
const CATS={
  math:{label:'Quantitative Aptitude',color:'#4DD0E1'},
  geo:{label:'Physical Geography',color:'#42A5F5'},

// ================================================================
// APP STATE
// ================================================================
let currentDateIdx = 0;
let activeFilter = 'all';
const TODAY_STR = new Date().toISOString().split('T')[0];
const DONE_KEY = 'upsc_done_v2';

function loadDone(){
  try{ return JSON.parse(localStorage.getItem(DONE_KEY)||'{}'); }catch(e){ return {}; }
}
function saveDone(done){ localStorage.setItem(DONE_KEY, JSON.stringify(done)); }

function toggleTask(taskId){
  const done = loadDone();
  if(done[taskId]) delete done[taskId]; else done[taskId] = 1;
  saveDone(done);
  updateAll();
}

// ================================================================
// RENDERING HELPERS
// ================================================================
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function parseDate(s){
  const[y,m,d]=s.split('-').map(Number);
  return new Date(y,m-1,d);
}
function formatDate(s){
  const d=parseDate(s);
  return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function getDayName(s){
  return DAYS[parseDate(s).getDay()];
}

function buildTaskCard(task, extraClass=''){
  const done=loadDone();
  const isDone=!!done[task.id];
  const c=task.c;
  const col=(CATS[c]||CATS.daily).color;
  return `<div class="task-card ${isDone?'done':''} bg-${c} ${extraClass}" onclick="toggleTask('${task.id}')" id="tc_${task.id}">
    <div class="task-cb" style="${isDone?`background:${col};border-color:${col}`:''}" id="cb_${task.id}">
      <span class="checkmark">✓</span>
    </div>
    <div class="task-txt">${task.t}</div>
  </div>`;
}

// ================================================================
// TODAY TAB
// ================================================================
function renderToday(){
  const entry = SCHEDULE[currentDateIdx];
  const done = loadDone();

  // Date display
  document.getElementById('dateDisplay').innerHTML =
    `${formatDate(entry.date)}${entry.date===TODAY_STR?'<span class="today-pill">TODAY</span>':''}`;
  document.getElementById('dayDisplay').textContent = getDayName(entry.date);

  // Nav buttons
  document.getElementById('prevBtn').disabled = currentDateIdx <= 0;
  document.getElementById('nextBtn').disabled = currentDateIdx >= SCHEDULE.length - 1;

  const tasks = entry.tasks;

  // Progress
  const total = tasks.length;
  const completed = tasks.filter(t=>done[t.id]).length;
  document.getElementById('progressCount').textContent = `${completed} / ${total}`;
  const pct = total > 0 ? Math.round((completed/total)*100) : 0;
  const fill = document.getElementById('progressFill');
  fill.style.width = pct+'%';
  fill.className = 'progress-fill' + (pct===100?' full':'');

  // Filter chips
  if(tasks.length > 0){
    const cats = [...new Set(tasks.map(t=>t.c))];
    let chips = `<div class="chip ${activeFilter==='all'?'active':''}" onclick="setFilter('all')">All</div>`;
    cats.forEach(c=>{
      const info = CATS[c]||CATS.daily;
      chips += `<div class="chip ${activeFilter===c?'active':''}" onclick="setFilter('${c}')" style="${activeFilter===c?'':''}">
        ${info.label}
      </div>`;
    });
    document.getElementById('filterRow').innerHTML = chips;
    document.getElementById('filterRow').style.display='flex';
  } else {
    document.getElementById('filterRow').style.display='none';
  }

  // Task container
  const container = document.getElementById('taskContainer');

  if(tasks.length === 0){
    container.innerHTML = `<div class="rest-day">
      <div class="rest-icon">🌙</div>
      <div class="rest-title">Rest Day</div>
      <div class="rest-text">No tasks scheduled for today.<br>Take a well-deserved break and recharge!</div>
    </div>`;
    return;
  }

  // Group by category
  const filtered = activeFilter === 'all' ? tasks : tasks.filter(t=>t.c===activeFilter);

  if(filtered.length === 0){
    container.innerHTML = `<div style="text-align:center;padding:30px;color:var(--muted);font-size:13.5px;">No tasks for this category today.</div>`;
    return;
  }

  // Group tasks by category
  const grouped = {};
  filtered.forEach(task=>{
    if(!grouped[task.c]) grouped[task.c]=[];
    grouped[task.c].push(task);
  });

  let html = '';
  Object.entries(grouped).forEach(([cat, catTasks])=>{
    const info = CATS[cat]||CATS.daily;
    html += `<div class="cat-section">
      <div class="cat-header">
        <div class="cat-dot" style="background:${info.color}"></div>
        <div class="cat-name">${info.label}</div>
      </div>`;
    catTasks.forEach(task=>{ html += buildTaskCard(task); });
    html += `</div>`;
  });
  container.innerHTML = html;
}

function setFilter(f){
  activeFilter = f;
  renderToday();
}

function navDate(dir){
  const newIdx = currentDateIdx + dir;
  if(newIdx >= 0 && newIdx < SCHEDULE.length){
    currentDateIdx = newIdx;
    activeFilter = 'all';
    renderToday();
    updateHeader();
  }
}

// ================================================================
// CALENDAR TAB
// ================================================================
function renderCalendar(){
  const done = loadDone();
  const container = document.getElementById('calendarContainer');

  // Group by month
  const months = {};
  SCHEDULE.forEach(entry=>{
    const d = parseDate(entry.date);
    const mk = `${d.getFullYear()}-${d.getMonth()}`;
    if(!months[mk]) months[mk]={label:`${MONTHS[d.getMonth()]} ${d.getFullYear()}`,entries:[]};
    months[mk].entries.push(entry);
  });

  let html = '';
  Object.values(months).forEach(month=>{
    html += `<div class="cal-section-hdr">${month.label}</div>`;
    month.entries.forEach(entry=>{
      const tasks = entry.tasks;
      const total = tasks.length;
      const completed = tasks.filter(t=>done[t.id]).length;
      const pct = total > 0 ? Math.round((completed/total)*100) : 100;
      const isToday = entry.date === TODAY_STR;
      const isCurrent = SCHEDULE[currentDateIdx].date === entry.date;

      let pillClass = 'zero-pill', pillText = `${total} tasks`;
      if(total===0){ pillText='Rest'; pillClass='zero-pill'; }
      else if(completed===total){ pillClass='all-pill'; pillText='✓ Done'; }
      else if(completed>0){ pillClass='done-pill'; pillText=`${completed}/${total}`; }

      html += `<div class="cal-item${isCurrent?' open':''}" id="cal_${entry.date}">
        <div class="cal-hdr" onclick="toggleCal('${entry.date}')">
          <div class="cal-date-info">
            <h3>${formatDate(entry.date)}${isToday?'<span class="today-pill">TODAY</span>':''}</h3>
            <p>${getDayName(entry.date)}</p>
          </div>
          <div class="cal-right">
            <span class="cal-pill ${pillClass}">${pillText}</span>
            <span class="expand-arr">▼</span>
          </div>
        </div>
        <div class="mini-prog"><div class="mini-prog-fill" style="width:${pct}%"></div></div>
        <div class="cal-tasks" id="calt_${entry.date}">`;
      if(tasks.length === 0){
        html += `<div style="text-align:center;padding:12px 0;color:var(--muted);font-size:13px;">Rest Day 🌙</div>`;
      } else {
        tasks.forEach(task=>{ html += buildTaskCard(task, ''); });
      }
      html += `</div></div>`;
    });
  });
  container.innerHTML = html;
}

function toggleCal(dateStr){
  const el = document.getElementById('cal_'+dateStr);
  if(el) el.classList.toggle('open');
}

// ================================================================
// PENDING TAB
// ================================================================
function renderPending(){
  const done = loadDone();
  const container = document.getElementById('pendingContainer');
  let pendingTotal = 0;

  let html = '';
  SCHEDULE.forEach(entry=>{
    const pending = entry.tasks.filter(t=>!done[t.id]);
    if(pending.length === 0) return;
    pendingTotal += pending.length;
    const isToday = entry.date === TODAY_STR;
    html += `<div class="pending-group">
      <div class="pending-date-hdr">
        <span>${getDayName(entry.date)}, </span>
        <span>${formatDate(entry.date)}</span>
        ${isToday?'<span class="today-pill" style="margin-left:6px;">TODAY</span>':''}
        <span style="float:right;color:var(--accent)">${pending.length} pending</span>
      </div>`;
    pending.forEach(task=>{ html += buildTaskCard(task,''); });
    html += `</div>`;
  });

  document.getElementById('pendingBadge').textContent = pendingTotal === 0
    ? '🎉 All done!' : `${pendingTotal} task${pendingTotal!==1?'s':''} pending`;

  if(pendingTotal === 0){
    container.innerHTML = `<div class="empty-state">
      <div class="empty-icon">🏆</div>
      <div class="empty-title">All Tasks Complete!</div>
      <div class="empty-text">You've completed every task in your schedule.<br>Outstanding dedication!</div>
    </div>`;
  } else {
    container.innerHTML = html;
  }

  // Update pending badge in nav
  const badge = document.getElementById('pendingNavBadge');
  if(pendingTotal > 0){
    badge.textContent = pendingTotal > 99 ? '99+' : pendingTotal;
    badge.style.display = 'flex';
  } else {
    badge.style.display = 'none';
  }
}

// ================================================================
// HEADER / OVERALL PROGRESS
// ================================================================
function updateHeader(){
  const done = loadDone();
  const allTasks = SCHEDULE.flatMap(e=>e.tasks);
  const total = allTasks.length;
  const completed = allTasks.filter(t=>done[t.id]).length;
  const pct = total > 0 ? Math.round((completed/total)*100) : 0;
  document.getElementById('overallPct').textContent = pct + '%';
}

// ================================================================
// TAB SWITCHING
// ================================================================
function switchTab(tab){
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');

  if(tab==='calendar') renderCalendar();
  if(tab==='pending') renderPending();
}

// ================================================================
// FULL UPDATE (called after any task toggle)
// ================================================================
function updateAll(){
  renderToday();
  updateHeader();
  // Re-render pending badge count
  const done = loadDone();
  const pendingTotal = SCHEDULE.flatMap(e=>e.tasks).filter(t=>!done[t.id]).length;
  const badge = document.getElementById('pendingNavBadge');
  if(pendingTotal > 0){
    badge.textContent = pendingTotal > 99 ? '99+' : pendingTotal;
    badge.style.display = 'flex';
  } else {
    badge.style.display = 'none';
  }
  // If calendar or pending tab is open, re-render
  if(document.getElementById('tab-calendar').classList.contains('active')) renderCalendar();
  if(document.getElementById('tab-pending').classList.contains('active')) renderPending();
}

// ================================================================
// INIT
// ================================================================
function init(){
  // Show quote
  const q = getNextQuote();
  document.getElementById('quoteText').textContent = `"${q.t}"`;
  document.getElementById('quoteAuthor').textContent = `— ${q.a}`;

  // Find today's index (or nearest future)
  let idx = SCHEDULE.findIndex(e => e.date === TODAY_STR);
  if(idx < 0){
    // Find nearest date
    const todayMs = new Date(TODAY_STR).getTime();
    let minDiff = Infinity;
    SCHEDULE.forEach((e,i)=>{
      const diff = Math.abs(parseDate(e.date).getTime() - todayMs);
      if(diff < minDiff){ minDiff=diff; idx=i; }
    });
  }
  if(idx < 0) idx = 0;
  currentDateIdx = idx;

  renderToday();
  updateHeader();

  // Init pending badge
  const done = loadDone();
  const pendingTotal = SCHEDULE.flatMap(e=>e.tasks).filter(t=>!done[t.id]).length;
  const badge = document.getElementById('pendingNavBadge');
  if(pendingTotal > 0){
    badge.textContent = pendingTotal > 99 ? '99+' : pendingTotal;
    badge.style.display = 'flex';
  }
}

init();
</script>
</body>
</html>
